<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu presente especial ❤️</title>
    <link rel="stylesheet" href="style_.css">
</head>
<body>
    <div class="scene-container">
        <div class="floating-hearts"></div>
        <div class="gift-container" onclick="openGift()">
            <div class="gift-3d">
                <div class="gift-box">
                    <div class="face front">
                        <div class="heart-pattern"></div>
                    </div>
                    <div class="face back">
                        <div class="heart-pattern"></div>
                    </div>
                    <div class="face right">
                        <div class="heart-pattern"></div>
                    </div>
                    <div class="face left">
                        <div class="heart-pattern"></div>
                    </div>
                    <div class="face top">
                        <div class="lid-decoration">
                            <span class="love-text">LOVE</span>
                        </div>
                    </div>
                    <div class="face bottom"></div>
                </div>
                <div class="ribbon ribbon-vertical"></div>
                <div class="ribbon ribbon-horizontal"></div>
                <div class="bow-3d">
                    <div class="bow-left"></div>
                    <div class="bow-right"></div>
                    <div class="bow-center"></div>
                </div>
            </div>
            <div class="shadow"></div>
            <div class="click-text">
                <span class="heart-icon">💕</span>
                Clique para abrir seu presente
                <span class="heart-icon">💕</span>
            </div>
        </div>
    </div>

    <script src="main_.js"></script>
</body>
</html>
